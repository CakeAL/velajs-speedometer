.cover {

.brand { display: flex; align-items: center; gap: 80px; transform: scale(1.18); transform-origin: center; }

}
.copy { width: 862px; }
h1, h2, p { margin: 0; }
h1 {
  font-family: "Maple Mono NF CN", "Maple Mono", monospace;
  font-size: 136px; line-height: 1.1; font-weight: 300;
  letter-spacing: -4px; color: #f4f5f7;
}
h2 {
  margin-top: 23px; font-family: "Maple Mono NF CN", "Maple Mono", monospace;
  font-size: 82px; line-height: 1.25; font-weight: 500;

}
p {

  font-size: 43px; line-height: 1.5; font-weight: 400;

  white-space: nowrap;
}
</style>
