[package]
name = "speedometer-astrobox-plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
crc32fast = "1.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
astrobox-ng-wit = "=0.4.0"
[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
